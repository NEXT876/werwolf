# .travis.yml
language: scala

scala:
  - 3.7.3   

jdk:
  - openjdk21   # Scala 3.7.3 braucht mindestens JDK 17, JDK 21 ist empfohlen

# Optional: SBT-Version fixieren (stabil)
before_install:
  - sbt -v sbtVersion

# Caching: SBT & Ivy (beschleunigt Builds massiv)
cache:
  directories:
    - $HOME/.ivy2/cache
    - $HOME/.sbt
    - $HOME/.cache/coursier   # Wichtig für Scala 3!

# Build & Test mit Coverage
script:
  - sbt clean coverage test coverageReport

# Coveralls nur bei Erfolg
after_success:
  - sbt coverageAggregate
  - sbt coveralls

# branches to track
branches:
  only:
    - main
    - master
    - feature/architecturefix

# Optional: Debug-Ausgabe bei Fehlern
env:
  global:
    - SBT_OPTS="-Xms512M -Xmx2G -XX:MaxMetaspaceSize=512M"
