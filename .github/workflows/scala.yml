name: Scala CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  # Wichtig für Dependency Submission:
  pull-requests: write   # für Dependabot alerts
  # Optional, wenn du SBOM hochladen willst:
  # packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Für genaue Dependency-Submission wichtig:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Run tests
        run: sbt test

      # Korrektes Dependency Submission (aktuelle Version)
      - name: Upload dependency graph
        uses: scalacenter/sbt-dependency-submission@v2
        with:
          # Optional: Nur bei PRs ausführen, spart Zeit
          # if: github.event_name == 'pull_request'
          modules-ignore: test   # ignoriert test-only Dependencies
          configs-ignore: test   # ignoriert test und it Konfigurationen
