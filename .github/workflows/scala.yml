name: Scala CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Nur noch EIN Setup-Schritt – das reicht!
      - name: Setup Java + Scala + SBT
        uses: olafurpg/setup-scala@v15
        with:
          java-version: temurin@1.21   # oder temurin@1.17

      # Der manuelle Cache ist jetzt überflüssig!
      # olafurpg/setup-scala cached automatisch ~/.sbt, ~/.ivy2, ~/.coursier
      # Du kannst ihn komplett entfernen → spart einen Step + ist zuverlässiger

      - name: Run tests with coverage
        run: sbt clean coverage test coverageReport
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

      - name: Upload coverage to Coveralls
        run: sbt coverageAggregate coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

      - name: Upload dependency graph
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: scalacenter/sbt-dependency-submission@v2
        with:
          modules-ignore: test
          configs-ignore: test
