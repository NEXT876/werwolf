name: Scala CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write  # Für Dependency Submission
  pull-requests: write  # Für Dependabot-Alerts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Wichtig für korrekte Commit-Info bei Coveralls

      # Setup Java 21 + SBT-Cache (automatisch!)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt  # Cached ~/.sbt + Dependencies – superschnell!

      # Setup SBT (offiziell und stabil)
      - name: Setup SBT
        uses: sbt/setup-sbt@v1  # ← Das ist der Fix: v1 existiert und funktioniert!

      # Manueller Cache ist jetzt überflüssig (durch setup-java abgedeckt)
      # Falls du ihn behalten willst: Lass ihn drin, schadet nicht

      - name: Run tests with coverage
        run: sbt clean coverage test coverageReport
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

      - name: Upload coverage to Coveralls
        run: sbt coverageAggregate coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          COVERALLS_FLAG_NAME: Scala CI
        if: success()

      - name: Upload dependency graph
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: scalacenter/sbt-dependency-submission@v2
        with:
          modules-ignore: test
          configs-ignore: test
